apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztp-secret-creator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ztp-secret-creator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ztp-secret-creator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
subjects:
- kind: ServiceAccount
  name: ztp-secret-creator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ztp-secret-creator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ztp-create-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    spec:
      serviceAccountName: ztp-secret-creator
      restartPolicy: OnFailure
      containers:
      - name: create-secrets
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          SRC_NS="openshift-gitops"

          CM_NAME="ztp-credentials-cm"
          echo "Reading credentials from ${CM_NAME} in ${SRC_NS}..."

          PULL_SECRET=$(oc get configmap ${CM_NAME} -n ${SRC_NS} -o jsonpath='{.data.pullSecret}')
          BMC_USER=$(oc get configmap ${CM_NAME} -n ${SRC_NS} -o jsonpath='{.data.bmcUsername}')
          BMC_PASS=$(oc get configmap ${CM_NAME} -n ${SRC_NS} -o jsonpath='{.data.bmcPassword}')

          echo "Creating pull secret..."
          oc create secret generic ztp-pull-secret \
            --from-literal=.dockerconfigjson="${PULL_SECRET}" \
            --type=kubernetes.io/dockerconfigjson \
            -n ${NAMESPACE} --dry-run=client -o yaml | oc apply -f -

          echo "Creating BMC secret..."
          oc create secret generic ztp-bmc-secret \
            --from-literal=username="${BMC_USER}" \
            --from-literal=password="${BMC_PASS}" \
            -n ${NAMESPACE} --dry-run=client -o yaml | oc apply -f -

          echo "Secrets created successfully."
