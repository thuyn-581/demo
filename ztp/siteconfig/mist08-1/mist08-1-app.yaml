apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztp-mist08-1
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: 'https://github.com/thuyn-581/demo.git'
    targetRevision: main
    path: ztp/siteconfig/mist08-1
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mist08-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
