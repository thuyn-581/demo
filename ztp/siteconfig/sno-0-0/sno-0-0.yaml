apiVersion: siteconfig.open-cluster-management.io/v1alpha1
kind: ClusterInstance
metadata:
  name: sno-0-0
  namespace: sno-0-0
spec:
  clusterName: "sno-0-0"
  baseDomain: "mist08-0.qe.red-chesterfield.com"
  clusterImageSetNameRef: "img4.22.9-x86-64-appsub" # References your desired OCP release
  sshPublicKey: "ssh-rsa "
  
  templateRefs:
    - name: ai-cluster-templates-v1
      namespace: ocm

  pullSecretRef:
    name: "ztp-pull-secret"
  
  # Network Topology configurations
  networkType: "OVNKubernetes"
  clusterNetwork:
    - cidr: "10.128.0.0/14"
      hostPrefix: 23
  serviceNetwork:
    - cidr: "172.30.0.0/16"
  machineNetwork:
    - cidr: "192.168.123.0/24"

  # Day 1 Cluster Manifest Overrides (Optional)
  # extraManifestsRefs:
  #   - name: "site1-extra-manifests-cm"

  # Hardware node definitions 
  nodes:
    - hostName: "worker-0-0"
      role: "master"
      bmcAddress: "redfish-virtualmedia://192.168.123.1:8000/redfish/v1/Systems/f4023c1b-3126-4c0f-8874-2c7eb28388f9"
      bmcCredentialsName:
        name: "ztp-bmc-secret"
      bootMACAddress: "52:54:00:16:d5:63"
      rootDeviceHints:
        deviceName: "/dev/sda"
      templateRefs:
        - name: ai-node-templates-v1
          namespace: ocm       
      nodeNetwork:
        interfaces:
          - name: "enp0s4"
            macAddress: "52:54:00:16:d5:63"
        config:
          interfaces:
            - name: enp0s4
              type: ethernet
              state: up
              ipv4:
                enabled: true
                address:
                  - ip: 192.168.123.122
                    prefix-length: 24
          routes:
            config:
              - destination: 0.0.0.0/0
                next-hop-address: 192.168.123.1
                next-hop-interface: enp0s4
          dns-resolver:
            config:
              server:
                - 8.8.8.8
